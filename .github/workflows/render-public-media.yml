name: Build public JPEG for Metricool
on:
  push:
    branches: [main]
    paths:
      - 'integration/weather_render.py'
      - '.github/workflows/render-public-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow==12.1.1
      - name: Render JPEG without metadata
        run: python3 integration/weather_render.py
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-media/weather-20261117.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Render public JPEG for Metricool"
            git push
          fi
