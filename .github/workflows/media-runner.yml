name: Haberler KKTC media runner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

permissions:
  contents: read

concurrency:
  group: haberler-kktc-media-runner
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || vars.MEDIA_RUNNER_HOURLY_CHECK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify live upload
        if: github.event_name == 'workflow_dispatch'
        env:
          MEDIA_API_TOKEN: ${{ secrets.MEDIA_API_TOKEN }}
        run: python3 verify_media.py
      - name: Verify authorization without uploading
        if: github.event_name == 'schedule'
        env:
          MEDIA_API_TOKEN: ${{ secrets.MEDIA_API_TOKEN }}
        run: python3 verify_media.py --check-only
